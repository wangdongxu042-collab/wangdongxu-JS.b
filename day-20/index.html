<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 20 · 商品列表与购物车</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a href="../index.html">JavaScript 练习</a>
      <span>DAY 20 / 商品列表与购物车</span>
    </header>

    <main>
      <section class="intro">
        <p class="eyebrow">DAY 20</p>
        <h1>商品列表与购物车</h1>
        <p>添加商品、修改数量，刷新页面后恢复购物车。</p>
      </section>

      <div class="shop-layout">
        <section class="catalog" aria-labelledby="catalog-title">
          <div class="section-heading">
            <h2 id="catalog-title">商品列表</h2>
            <button id="reload" type="button">重新加载</button>
          </div>

          <!-- 搜索、分类和排序暂未实现。 -->
          <fieldset class="filters">
            <legend>搜索与筛选（待实现）</legend>
            <label class="search-label" for="search">搜索商品
              <input id="search" type="search" placeholder="关键词搜索待实现" disabled>
            </label>
            <label for="category">商品分类
              <select id="category" disabled><option>全部分类</option></select>
            </label>
            <label for="sort">排序方式
              <select id="sort" disabled><option>默认顺序</option><option>价格从低到高</option><option>价格从高到低</option></select>
            </label>
          </fieldset>

          <div class="results-meta">
            <p id="result-count" role="status">准备获取商品</p>
            <span>价格单位：USD 美元</span>
          </div>

          <!-- loading、error、empty 分别对应三种提示状态。 -->
          <div id="product-region" aria-busy="true">
            <div id="loading" class="state-box" role="status">
              <span class="spinner" aria-hidden="true"></span>
              <h3>正在加载商品…</h3>
              <p>正在等待接口返回数据。</p>
            </div>
            <div id="error" class="state-box error-box" role="alert" hidden>
              <h3>商品加载失败</h3>
              <p id="error-message"></p>
              <button id="retry" type="button">重新尝试</button>
            </div>
            <div id="empty" class="state-box" role="status" hidden>
              <h3>暂时没有商品</h3>
              <p>接口请求成功，但商品列表为空。</p>
            </div>
            <!-- JavaScript 把生成的商品卡片放进这个容器。 -->
            <div id="products" class="product-grid"></div>
          </div>
          <noscript><p class="state-box">请启用 JavaScript，以获取并显示商品。</p></noscript>
        </section>

        <!-- cart-items 显示购物车记录，金额和数量由 JavaScript 更新。 -->
        <aside class="cart-panel" aria-labelledby="cart-title">
          <h2 id="cart-title" tabindex="-1">购物车</h2>
          <p id="cart-empty" class="cart-empty">购物车为空。</p>
          <ul id="cart-items" class="cart-items" aria-label="购物车商品"></ul>
          <p id="cart-message" class="cart-message" role="status"></p>
          <div class="cart-count"><span>商品数量</span><strong id="total-quantity">0 件</strong></div>
          <div class="cart-total"><span>合计</span><strong id="total-price">US$0.00</strong></div>
          <button id="clear-cart" class="secondary" type="button" disabled>清空购物车</button>
          <p id="save-status" class="save-status" role="status">购物车自动保存在当前浏览器。</p>
        </aside>
      </div>
    </main>

    <footer><span>Day 20 · 商品列表与购物车</span><a href="README.md">操作手顺</a></footer>
  </div>
</body>
</html>
