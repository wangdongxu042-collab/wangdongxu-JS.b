<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>显示与隐藏密码</title>
</head>
<body>
    <h1>密码输入</h1>

    <input id="passwordInput" type="password" placeholder="请输入密码">

    <button id="toggleButton" onclick="togglePassword()">
        显示密码
    </button>

    <script>
        function togglePassword() {
            // 1. 找到输入框和按钮
            let input = document.getElementById("passwordInput");
            let button = document.getElementById("toggleButton");

            // 2. 判断输入框当前是否隐藏密码
            if (input.type === "password") {
                // 改成普通文本输入框，显示内容
                input.type = "text";
                button.textContent = "隐藏密码";
            } else {
                // 改回密码输入框，隐藏内容
                input.type = "password";
                button.textContent = "显示密码";
            }
        }
    </script>
</body>
</html>
