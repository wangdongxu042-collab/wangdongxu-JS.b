<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>成绩判断</title>
</head>
<body>
    <h1>成绩判断</h1>

    <input id="scoreInput" type="number" min="0" max="100" placeholder="请输入成绩">
    <button onclick="checkScore()">查看结果</button>

    <p id="result">结果会显示在这里</p>

    <script>
        function checkScore() {
            // 获取输入框中的内容，并转换成数字
            let score = Number(document.getElementById("scoreInput").value);

            // 找到用于显示结果的段落
            let result = document.getElementById("result");

            // 补全下面的条件和显示文字
            if (score >= 90) {
                result.textContent = "优秀";
            } else if (score >= 70) {
                result.textContent = "良好";
            } else {
                result.textContent = "需要努力";
            }
        }
    </script>
</body>
</html>
