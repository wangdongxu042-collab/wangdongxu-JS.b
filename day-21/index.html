<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的主页</title>

  <style>
    body {
      background: #f2f4f8;
      font-family: sans-serif;
      padding: 40px 20px;
    }

    .card {
      max-width: 360px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      text-align: center;
    }

    button {
      padding: 12px 24px;
      background: #3366ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>你好，我是小王</h1>
    <p>这是我做的第一个网页。</p>
    <button onclick="sayHello()">打个招呼</button>
  </div>

  <script>
    function sayHello() {
      alert("很高兴认识你！");
    }
  </script>
</body>
</html>
